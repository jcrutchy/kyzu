<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kyzu :: bus terminal</title>
<style>
  :root{
    --bg:#0a0e0c;
    --panel:#0f1512;
    --line:#1c2620;
    --text:#c9d6cd;
    --dim:#5c6b62;
    --accent:#5ee6a8;
    --accent-dim:#2c5c46;
    --warn:#e6c85e;
    --err:#e65e5e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Mono","Consolas",monospace;
    font-size:14px;
  }
  body{
    display:flex; flex-direction:column;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:24px 24px;
    background-position:-1px -1px;
  }
  header{
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
    background:rgba(10,14,12,0.85);
    backdrop-filter:blur(2px);
  }
  header .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--err);
    box-shadow:0 0 6px var(--err);
    transition:background .2s, box-shadow .2s;
  }
  header .dot.up{ background:var(--accent); box-shadow:0 0 6px var(--accent); }
  header .dot.connecting{ background:var(--warn); box-shadow:0 0 6px var(--warn); }
  header h1{
    font-size:13px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--dim); margin:0;
  }
  header h1 span{ color:var(--accent); }
  header .status{
    margin-left:auto; font-size:12px; color:var(--dim);
  }
  header .tick{
    font-size:12px; color:var(--accent-dim);
    border:1px solid var(--line);
    padding:3px 8px;
    min-width:110px;
  }
  header .tick b{ color:var(--accent); font-weight:600; }

  .filterrow{ display:flex; align-items:center; gap:8px; }
  .filterrow label{ font-size:11px; color:var(--dim); white-space:nowrap; }
  .filterrow input[type=text]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    font:inherit; font-size:12px;
    padding:6px 8px;
    outline:none;
  }
  .filterrow input[type=text]:focus{ border-color:var(--accent-dim); color:var(--text); }

  #log{
    flex:1; overflow-y:auto;
    padding:14px 16px;
    display:flex; flex-direction:column; gap:2px;
  }
  .line{ white-space:pre-wrap; word-break:break-all; line-height:1.5; }
  .line .t{ color:var(--dim); }
  .line.sys{ color:var(--dim); }
  .line.tx{ color:var(--accent); }
  .line.tx .topic{ color:var(--accent); }
  .line.rx{ color:var(--text); }
  .line.rx .topic{ color:#7fb3e6; }
  .line.err{ color:var(--err); }
  .line .payload{ color:var(--text); }

  footer{
    border-top:1px solid var(--line);
    padding:10px 16px;
    display:flex; flex-direction:column; gap:8px;
    background:rgba(10,14,12,0.85);
  }
  .cmdrow{ display:flex; gap:8px; }
  .cmdrow input[type=text]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font:inherit;
    padding:8px 10px;
    outline:none;
  }
  .cmdrow input[type=text]:focus{ border-color:var(--accent-dim); }
  button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--accent);
    font:inherit;
    padding:8px 14px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  button:hover{ border-color:var(--accent); }
  button:active{ transform:translateY(1px); }
  .quickrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .quickrow button{ font-size:12px; color:var(--dim); }
  .quickrow button:hover{ color:var(--accent); border-color:var(--accent-dim); }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--line); }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <h1>kyzu <span>// bus terminal</span></h1>
  <div class="tick" id="tickDisplay">tick: <b>-</b></div>
  <div class="status" id="statusText">disconnected</div>
</header>

<div id="log"></div>

<footer>
  <div class="filterrow">
    <label>hide topics starting with (comma-separated):</label>
    <input type="text" id="filterInput" value="game.tick">
  </div>
  <div class="quickrow">
    <button data-topic="game.cmd.ping" data-payload="{}">ping</button>
    <button id="btnSubscribe">subscribe game.&gt;</button>
    <button id="btnReconnect">reconnect</button>
  </div>
  <div class="cmdrow">
    <input type="text" id="topicInput" placeholder="topic  (e.g. game.cmd.move)" style="flex:0 0 220px;">
    <input type="text" id="payloadInput" placeholder='payload JSON  (e.g. {"dir":"n"})'>
    <button id="btnSend">publish</button>
  </div>
</footer>

<script>
(function(){
  const WS_URL = 'ws://' + location.hostname + ':8082';
  const AUTH_TOKEN = 'dev'; // stub auth - any non-empty token is accepted today

  const logEl = document.getElementById('log');
  const dotEl = document.getElementById('statusDot');
  const statusEl = document.getElementById('statusText');
  const topicInput = document.getElementById('topicInput');
  const payloadInput = document.getElementById('payloadInput');
  const filterInput = document.getElementById('filterInput');
  const tickDisplay = document.getElementById('tickDisplay').querySelector('b');

  let ws = null;
  let authed = false;
  let hiddenPrefixes = [];

  function refreshFilters(){
    hiddenPrefixes = filterInput.value.split(',')
      .map(s => s.trim())
      .filter(s => s.length > 0);
  }
  function isHidden(topic){
    return hiddenPrefixes.some(p => topic.startsWith(p));
  }
  filterInput.addEventListener('input', refreshFilters);
  refreshFilters();

  function nowStamp(){
    const d = new Date();
    return d.toTimeString().slice(0,8);
  }

  function appendLine(cls, html){
    const div = document.createElement('div');
    div.className = 'line ' + cls;
    div.innerHTML = '<span class="t">[' + nowStamp() + ']</span> ' + html;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function logSys(msg){ appendLine('sys', msg); }
  function logErr(msg){ appendLine('err', msg); }
  function logTx(topic, payload){
    appendLine('tx', '<span class="topic">&gt; ' + escapeHtml(topic) + '</span> <span class="payload">' + escapeHtml(payload) + '</span>');
  }
  function logRx(topic, payload, source){
    // game.tick updates the fixed readout instead of scrolling the log -
    // it fires ~20/sec and would otherwise bury everything else.
    if (topic === 'game.tick'){
      try {
        const parsed = JSON.parse(payload);
        if (parsed && parsed.tick !== undefined) tickDisplay.textContent = parsed.tick;
      } catch(e) { /* payload wasn't the shape we expected - ignore */ }
    }

    if (isHidden(topic)) return;

    appendLine('rx', '<span class="topic">&lt; ' + escapeHtml(topic) + '</span> <span class="payload">' + escapeHtml(payload) + '</span>' +
      (source ? ' <span class="t">(' + escapeHtml(source) + ')</span>' : ''));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function setStatus(state){
    dotEl.className = 'dot' + (state === 'up' ? ' up' : state === 'connecting' ? ' connecting' : '');
    statusEl.textContent = state;
  }

  function rpc(method, params){
    if (!ws || ws.readyState !== WebSocket.OPEN){
      logErr('not connected - cannot send ' + method);
      return;
    }
    const msg = Object.assign({method: method}, params || {});
    ws.send(JSON.stringify(msg));
  }

  function doPublish(topic, payloadStr){
    let payload;
    try { payload = JSON.parse(payloadStr); }
    catch(e){ logErr('payload is not valid JSON: ' + e.message); return; }
    rpc('publish', {topic: topic, payload: payload});
    logTx(topic, payloadStr);
  }

  function connect(){
    setStatus('connecting');
    logSys('connecting to ' + WS_URL + ' ...');
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      logSys('socket open, authenticating...');
      rpc('sys.auth', {token: AUTH_TOKEN});
    };

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); }
      catch(e){ logErr('unparseable frame: ' + evt.data); return; }

      // First successful response after sys.auth we treat as "authed" -
      // adjust here if the server starts sending an explicit ack shape.
      if (!authed){
        authed = true;
        setStatus('up');
        logSys('authenticated.');
        return;
      }

      if (msg.topic !== undefined){
        logRx(msg.topic, typeof msg.payload === 'string' ? msg.payload : JSON.stringify(msg.payload), msg.source);
      } else {
        logSys('recv: ' + evt.data);
      }
    };

    ws.onerror = () => {
      logErr('websocket error');
    };

    ws.onclose = () => {
      authed = false;
      setStatus('disconnected');
      logSys('connection closed.');
    };
  }

  document.querySelectorAll('.quickrow button[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      doPublish(btn.dataset.topic, btn.dataset.payload || '{}');
    });
  });

  document.getElementById('btnSubscribe').addEventListener('click', () => {
    rpc('subscribe', {filter: 'game.>'});
    logSys('subscribe requested: game.>');
  });

  document.getElementById('btnReconnect').addEventListener('click', () => {
    if (ws) ws.close();
    connect();
  });

  document.getElementById('btnSend').addEventListener('click', () => {
    const topic = topicInput.value.trim();
    const payload = payloadInput.value.trim() || '{}';
    if (!topic){ logErr('enter a topic first'); return; }
    doPublish(topic, payload);
  });

  payloadInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnSend').click();
  });

  connect();
})();
</script>

</body>
</html>
