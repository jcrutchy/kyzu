<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kyzu :: map</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0a0e0c;
    font-family: "IBM Plex Mono", "Consolas", monospace;
  }
  canvas {
    display: block;
    width: 100vw; height: 100vh;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  #hud {
    position: fixed; top: 10px; left: 10px;
    color: #5ee6a8; font-size: 12px;
    background: rgba(10,14,12,0.7);
    border: 1px solid #1c2620;
    padding: 6px 10px;
    pointer-events: none;
    line-height: 1.5;
  }
  #hud .dim { color: #5c6b62; }
  #hud .wsdot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #e65e5e; margin-right: 4px;
  }
  #hud .wsdot.up { background: #5ee6a8; }

  #layerPanel {
    position: fixed; top: 10px; right: 10px;
    background: rgba(10,14,12,0.85);
    border: 1px solid #1c2620;
    padding: 10px 12px;
    font-size: 12px;
    color: #c9d6cd;
    min-width: 160px;
  }
  #layerPanel .section { margin-bottom: 8px; }
  #layerPanel .label { color: #5c6b62; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  #layerPanel button {
    background: #0f1512; border: 1px solid #1c2620; color: #5c6b62;
    font: inherit; font-size: 11px; padding: 4px 8px; margin-right: 4px; margin-bottom: 4px;
    cursor: pointer;
  }
  #layerPanel button.active { color: #5ee6a8; border-color: #2c5c46; }
  #layerPanel button:hover { color: #5ee6a8; }
  #layerPanel select {
    background: #0f1512; border: 1px solid #1c2620; color: #c9d6cd;
    font: inherit; font-size: 11px; padding: 3px 6px; width: 100%;
  }
  #layerPanel input[type=range] { width: 100%; margin-top: 4px; }
  #overlayOpacityRow { display: none; }
  #overlayOpacityRow.shown { display: block; }
</style>
</head>
<body>

<canvas id="mapCanvas"></canvas>
<div id="hud">
  <span class="wsdot" id="wsDot"></span>ws: <span id="wsStatus">connecting</span> <span class="dim">| units: <span id="unitCount">0</span></span><br>
  zoom: <span id="hudZoom">-</span> <span class="dim">(level <span id="hudLevel">-</span>)</span><br>
  lon/lat: <span id="hudLonLat">-</span>
</div>

<div id="layerPanel">
  <div class="section">
    <div class="label">base layer</div>
    <button id="btnBaseLandcover" class="active">Land Cover</button>
    <button id="btnBaseHeightmap">Elevation</button>
    <button id="btnBaseCombined">Combined</button>
  </div>
  <div class="section">
    <div class="label">overlay</div>
    <select id="overlaySelect">
      <option value="none">None</option>
      <option value="landcover">Land Cover</option>
      <option value="heightmap">Elevation</option>
      <option value="combined">Combined</option>
    </select>
    <div id="overlayOpacityRow">
      <input type="range" id="overlayOpacity" min="0" max="100" value="50">
    </div>
  </div>
</div>

<script>
(function(){
  const TILE_SIZE = 256;
  const MIN_LEVEL = 0;

  // Each layer is an independent tile pyramid - MUST match whatever max
  // level that layer was actually baked to (kyzu_bake_tiles <level> /
  // kyzu_bake_heightmap_tiles <level>). Tiles beyond a layer's own
  // maxLevel simply don't exist and fail to load silently (handled - see
  // getTile), so mismatched values here just mean that layer stops
  // getting more detailed past that zoom, not a crash.
  const LAYERS = {
    landcover: { name: 'Land Cover', path: 'http://127.0.0.1:8092/tiles',           maxLevel: 6, cache: new Map() },
    heightmap: { name: 'Elevation',  path: 'http://127.0.0.1:8092/tiles_heightmap', maxLevel: 6, cache: new Map() },
    combined:  { name: 'Combined',   path: 'http://127.0.0.1:8092/tiles_combined',  maxLevel: 6, cache: new Map() }
  };
  const GLOBAL_MAX_LEVEL = Math.max(...Object.values(LAYERS).map(l => l.maxLevel));

  const state = {
    baseLayer: 'landcover',
    overlayLayer: 'none',
    overlayOpacity: 0.5
  };

  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const hudZoom = document.getElementById('hudZoom');
  const hudLevel = document.getElementById('hudLevel');
  const hudLonLat = document.getElementById('hudLonLat');

  const view = { lon: 0, lat: 0, zoom: 2 };

  // ---- live units, fed over the same WS bus the terminal page uses ----
  // Below this zoom, units render as simple dots; at/above it, as a small
  // icon shape with an id label - same "snap the data source, smooth the
  // visual" LOD spirit as the tile pyramid's continuous zoom scaling.
  const ICON_ZOOM_THRESHOLD = 4;
  const WS_URL = 'ws://' + location.hostname + ':8082';
  const AUTH_TOKEN = 'dev'; // stub auth - matches the terminal page's convention

  const units = new Map(); // unit_id -> {lon, lat, prevLon, prevLat, updateTime, prevUpdateTime}
  let ws = null;
  let wsAuthed = false;

  const wsDot = document.getElementById('wsDot');
  const wsStatus = document.getElementById('wsStatus');
  const unitCountEl = document.getElementById('unitCount');

  function setWsStatus(state) {
    wsDot.classList.toggle('up', state === 'up');
    wsStatus.textContent = state;
  }

  function onUnitPosition(unitId, lon, lat) {
    const now = performance.now();
    const existing = units.get(unitId);
    if (existing) {
      existing.prevLon = existing.lon; existing.prevLat = existing.lat; existing.prevUpdateTime = existing.updateTime;
      existing.lon = lon; existing.lat = lat; existing.updateTime = now;
    } else {
      units.set(unitId, { lon, lat, prevLon: lon, prevLat: lat, updateTime: now, prevUpdateTime: now });
    }
    unitCountEl.textContent = String(units.size);
  }

  // Interpolates between a unit's last two known server positions based
  // on elapsed real time since the latest update, using the actual
  // measured interval between those updates as the interpolation window -
  // so display stays smooth regardless of the server's exact tick rate,
  // and just holds at the last known position (rather than overshooting)
  // if an update is late.
  function getUnitDisplayPosition(u) {
    const interval = u.updateTime - u.prevUpdateTime;
    const t = interval > 0 ? Math.min(1, (performance.now() - u.updateTime) / interval) : 1;
    return {
      lon: u.prevLon + (u.lon - u.prevLon) * t,
      lat: u.prevLat + (u.lat - u.prevLat) * t
    };
  }

  function connectWS() {
    setWsStatus('connecting');
    ws = new WebSocket(WS_URL);
    wsAuthed = false;

    ws.onopen = () => {
      ws.send(JSON.stringify({ method: 'sys.auth', token: AUTH_TOKEN }));
    };

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch (e) { return; }

      // First message after sys.auth is treated as an implicit ack, same
      // convention as the terminal page - adjust here if the server ever
      // starts sending an explicit ack shape.
      if (!wsAuthed) {
        wsAuthed = true;
        setWsStatus('up');
        ws.send(JSON.stringify({ method: 'subscribe', filter: 'game.>' }));
        return;
      }

      if (msg.topic === 'game.event.position') {
        let payload;
        try { payload = typeof msg.payload === 'string' ? JSON.parse(msg.payload) : msg.payload; }
        catch (e) { return; }
        if (payload && payload.unit_id !== undefined) {
          onUnitPosition(payload.unit_id, payload.lon, payload.lat);
        }
      }
      // spawned/path_found/arrived/move_failed intentionally not handled
      // here yet - this viewer only needs live position to render units,
      // the terminal page is still the place to watch full command/event
      // traffic for now.
    };

    ws.onerror = () => { setWsStatus('error'); };
    ws.onclose = () => {
      setWsStatus('disconnected');
      setTimeout(connectWS, 2000); // simple reconnect - fine for a dev viewer, revisit if this becomes player-facing
    };
  }


  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function worldPixelWidth(z)  { return TILE_SIZE * Math.pow(2, z + 1); }
  function worldPixelHeight(z) { return TILE_SIZE * Math.pow(2, z); }

  function lonLatToWorld(lon, lat, z) {
    return {
      x: (lon + 180) / 360 * worldPixelWidth(z),
      y: (90 - lat) / 180 * worldPixelHeight(z)
    };
  }
  function worldToLonLat(x, y, z) {
    return {
      lon: x / worldPixelWidth(z) * 360 - 180,
      lat: 90 - y / worldPixelHeight(z) * 180
    };
  }

  function getTile(layerKey, z, x, y) {
    const layer = LAYERS[layerKey];
    const key = z + '/' + x + '/' + y;
    let entry = layer.cache.get(key);
    if (!entry) {
      const img = new Image();
      entry = { img: img, loaded: false, failed: false };
      img.onload = () => { entry.loaded = true; };
      img.onerror = () => { entry.failed = true; };
      img.src = layer.path + '/' + key + '.png';
      layer.cache.set(key, entry);
    }
    return entry;
  }

  function clampView() {
    view.zoom = Math.max(MIN_LEVEL, Math.min(GLOBAL_MAX_LEVEL, view.zoom));
    view.lat = Math.max(-90, Math.min(90, view.lat));
    view.lon = Math.max(-180, Math.min(180, view.lon));
  }

  function drawLayer(layerKey, alpha) {
    const layer = LAYERS[layerKey];
    const cw = canvas.width, ch = canvas.height;
    const L = Math.max(MIN_LEVEL, Math.min(layer.maxLevel, Math.round(view.zoom)));
    const centerWorld = lonLatToWorld(view.lon, view.lat, view.zoom);

    const topLeft = worldToLonLat(centerWorld.x - cw / 2, centerWorld.y - ch / 2, view.zoom);
    const bottomRight = worldToLonLat(centerWorld.x + cw / 2, centerWorld.y + ch / 2, view.zoom);

    const tilesAcross = Math.pow(2, L + 1);
    const tilesDown = Math.pow(2, L);

    let txMin = Math.floor((topLeft.lon + 180) / 360 * tilesAcross) - 1;
    let txMax = Math.ceil((bottomRight.lon + 180) / 360 * tilesAcross) + 1;
    let tyMin = Math.floor((90 - topLeft.lat) / 180 * tilesDown) - 1;
    let tyMax = Math.ceil((90 - bottomRight.lat) / 180 * tilesDown) + 1;

    txMin = Math.max(0, txMin); txMax = Math.min(tilesAcross - 1, txMax);
    tyMin = Math.max(0, tyMin); tyMax = Math.min(tilesDown - 1, tyMax);

    ctx.globalAlpha = alpha;
    for (let ty = tyMin; ty <= tyMax; ty++) {
      for (let tx = txMin; tx <= txMax; tx++) {
        const lonMin = -180 + tx * (360 / tilesAcross);
        const lonMax = lonMin + 360 / tilesAcross;
        const latMax = 90 - ty * (180 / tilesDown);
        const latMin = latMax - 180 / tilesDown;

        const p0 = lonLatToWorld(lonMin, latMax, view.zoom);
        const p1 = lonLatToWorld(lonMax, latMin, view.zoom);

        const sx = cw / 2 + (p0.x - centerWorld.x);
        const sy = ch / 2 + (p0.y - centerWorld.y);
        const sw = p1.x - p0.x;
        const sh = p1.y - p0.y;

        const entry = getTile(layerKey, L, tx, ty);
        if (entry.loaded) {
          ctx.drawImage(entry.img, sx, sy, sw + 1, sh + 1);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // Units are vector-drawn on top of whatever tile layers are showing,
  // not baked into any raster tile - completely decoupled from terrain
  // resolution, same architecture decision as the city-growth-footprint
  // discussion (dynamic game data doesn't belong in the static pyramid).
  function drawUnits() {
    const cw = canvas.width, ch = canvas.height;
    const centerWorld = lonLatToWorld(view.lon, view.lat, view.zoom);
    const useIcons = view.zoom >= ICON_ZOOM_THRESHOLD;

    for (const [id, u] of units) {
      const pos = getUnitDisplayPosition(u);
      const w = lonLatToWorld(pos.lon, pos.lat, view.zoom);
      const sx = cw / 2 + (w.x - centerWorld.x);
      const sy = ch / 2 + (w.y - centerWorld.y);

      if (sx < -20 || sx > cw + 20 || sy < -20 || sy > ch + 20) continue; // offscreen

      if (useIcons) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.lineTo(-6, 0);
        ctx.closePath();
        ctx.fillStyle = '#5ee6a8';
        ctx.fill();
        ctx.strokeStyle = '#0a0e0c';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#c9d6cd';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(id, sx, sy + 18);
      } else {
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#5ee6a8';
        ctx.fill();
        ctx.strokeStyle = '#0a0e0c';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function render() {
    const cw = canvas.width, ch = canvas.height;
    ctx.fillStyle = '#0a0e0c';
    ctx.fillRect(0, 0, cw, ch);

    drawLayer(state.baseLayer, 1.0);
    if (state.overlayLayer !== 'none') {
      drawLayer(state.overlayLayer, state.overlayOpacity);
    }
    drawUnits();

    const L = Math.max(MIN_LEVEL, Math.min(LAYERS[state.baseLayer].maxLevel, Math.round(view.zoom)));
    hudZoom.textContent = view.zoom.toFixed(2);
    hudLevel.textContent = String(L);
    hudLonLat.textContent = view.lon.toFixed(2) + ', ' + view.lat.toFixed(2);

    requestAnimationFrame(render);
  }

  const btnBaseLandcover = document.getElementById('btnBaseLandcover');
  const btnBaseHeightmap = document.getElementById('btnBaseHeightmap');
  const btnBaseCombined = document.getElementById('btnBaseCombined');
  const overlaySelect = document.getElementById('overlaySelect');
  const overlayOpacityRow = document.getElementById('overlayOpacityRow');
  const overlayOpacitySlider = document.getElementById('overlayOpacity');

  function setBaseLayer(key) {
    state.baseLayer = key;
    btnBaseLandcover.classList.toggle('active', key === 'landcover');
    btnBaseHeightmap.classList.toggle('active', key === 'heightmap');
    btnBaseCombined.classList.toggle('active', key === 'combined');
    if (state.overlayLayer === key) {
      state.overlayLayer = 'none';
      overlaySelect.value = 'none';
      overlayOpacityRow.classList.remove('shown');
    }
  }
  btnBaseLandcover.addEventListener('click', () => setBaseLayer('landcover'));
  btnBaseHeightmap.addEventListener('click', () => setBaseLayer('heightmap'));
  btnBaseCombined.addEventListener('click', () => setBaseLayer('combined'));

  overlaySelect.addEventListener('change', () => {
    state.overlayLayer = overlaySelect.value;
    overlayOpacityRow.classList.toggle('shown', state.overlayLayer !== 'none');
  });
  overlayOpacitySlider.addEventListener('input', () => {
    state.overlayOpacity = overlayOpacitySlider.value / 100;
  });

  let dragging = false, lastX = 0, lastY = 0;

  canvas.addEventListener('mousedown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    canvas.classList.remove('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    view.lon -= dx / worldPixelWidth(view.zoom) * 360;
    view.lat += dy / worldPixelHeight(view.zoom) * 180;
    clampView();
  });

  function zoomToward(mx, my, deltaZoom) {
    const centerWorldBefore = lonLatToWorld(view.lon, view.lat, view.zoom);
    const cursorWorldBefore = {
      x: centerWorldBefore.x + (mx - canvas.width / 2),
      y: centerWorldBefore.y + (my - canvas.height / 2)
    };
    const cursorLonLat = worldToLonLat(cursorWorldBefore.x, cursorWorldBefore.y, view.zoom);

    view.zoom = Math.max(MIN_LEVEL, Math.min(GLOBAL_MAX_LEVEL, view.zoom + deltaZoom));

    const cursorWorldAfter = lonLatToWorld(cursorLonLat.lon, cursorLonLat.lat, view.zoom);
    const newCenterWorld = {
      x: cursorWorldAfter.x - (mx - canvas.width / 2),
      y: cursorWorldAfter.y - (my - canvas.height / 2)
    };
    const newCenter = worldToLonLat(newCenterWorld.x, newCenterWorld.y, view.zoom);
    view.lon = newCenter.lon;
    view.lat = newCenter.lat;
    clampView();
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomToward(e.clientX - rect.left, e.clientY - rect.top, -e.deltaY * 0.0025);
  }, { passive: false });

  let touchMode = null;
  let touchLastX = 0, touchLastY = 0;
  let pinchStartDist = 0, pinchStartZoom = 0, pinchMidX = 0, pinchMidY = 0;

  function touchDist(t0, t1) {
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      touchMode = 'pan';
      touchLastX = e.touches[0].clientX;
      touchLastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartZoom = view.zoom;
      const rect = canvas.getBoundingClientRect();
      pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (touchMode === 'pan' && e.touches.length === 1) {
      const dx = e.touches[0].clientX - touchLastX;
      const dy = e.touches[0].clientY - touchLastY;
      touchLastX = e.touches[0].clientX;
      touchLastY = e.touches[0].clientY;
      view.lon -= dx / worldPixelWidth(view.zoom) * 360;
      view.lat += dy / worldPixelHeight(view.zoom) * 180;
      clampView();
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      const dist = touchDist(e.touches[0], e.touches[1]);
      const targetZoom = pinchStartZoom + Math.log2(dist / pinchStartDist);
      zoomToward(pinchMidX, pinchMidY, targetZoom - view.zoom);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) touchMode = null;
  });

  requestAnimationFrame(render);
  connectWS();
})();
</script>

</body>
</html>
