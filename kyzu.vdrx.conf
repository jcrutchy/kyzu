{
  "description": "Kyzu's VDRX executive definitions - included from vdrx.conf via includes",
  "http_sites": [
    {
      "id": "kyzu",
      "port": 8090,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "C:/dev/kyzu/web/static",
      "template_dir": "C:/dev/kyzu/web/templates"
    },
    {
      "id": "kyzu_map",
      "port": 8091,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "C:/dev/kyzu/web/map/static",
      "template_dir": "C:/dev/kyzu/web/map/templates"
    },
    {
      "id": "kyzu_data",
      "port": 8092,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "C:/dev/kyzu_data/public",
      "template_dir": "",
      "cors": true,
      "headers": {
        "Access-Control-Allow-Origin": "*",
        "Access-Control-Allow-Methods": "GET, OPTIONS",
        "Access-Control-Allow-Headers": "*"
      }
    },
    {
      "id": "kyzu_dashboard",
      "port": 8093,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "C:/dev/kyzu/web/dashboard",
      "template_dir": "C:/dev/kyzu/web/map/templates"
    }
  ],
  "processes": [
    {
      "id": "kyzu_game",
      "command": "C:/dev/kyzu/kyzu.exe",
      "restart": "always",
      "graceful_timeout_ms": 5000,
      "subscribe": ["game.cmd.>"],
      "publish": ["game.tick", "game.event.>"],
      "prefix": "",
      "host": "",
      "port": "",
      "enabled": true
    }
  ]
}
